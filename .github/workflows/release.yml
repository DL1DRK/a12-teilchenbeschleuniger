name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_sqlite
          coverage: none

      - name: Version abgleichen
        shell: bash
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(tr -d '\r\n' < VERSION)"

      - name: Bauen und prüfen
        run: |
          node tools/build-installer.mjs
          node tools/build-updater.mjs
          node --check app/app.js
          node tools/verify-installer.mjs
          node tools/verify-updater.mjs
          python3 tools/verify-schema.py
          python3 tools/verify-migration.py
          find app tools -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: GitHub Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          installer.php updater.php
          --verify-tag
          --generate-notes
          --title "A12-Teilchenbeschleuniger ${GITHUB_REF_NAME}"
